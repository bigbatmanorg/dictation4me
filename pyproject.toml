[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dictation4me"
version = "0.2.0"
description = "System-wide voice dictation, live transcription and AI-assisted notes for KDE Plasma (Wayland)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Dictation4me contributors"}]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=15,<17",
    "nativehtmlkit>=0.1.2,<0.2",
    "sounddevice>=0.5.1,<0.6",
    "numpy>=1.26,<3",
    "keyring>=25,<27",
    "dbus-next>=0.2.3,<0.3; sys_platform == 'linux'",
    "python-xlib>=0.33,<0.34; sys_platform == 'linux'",
]
classifiers = [
 "Development Status :: 4 - Beta",
 "Intended Audience :: End Users/Desktop",
 "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13",
 "Programming Language :: Python :: 3.14",
 "Operating System :: POSIX :: Linux", "Operating System :: Microsoft :: Windows",
 "Topic :: Multimedia :: Sound/Audio :: Speech", "Topic :: Office/Business",
]
keywords = ["dictation", "speech-to-text", "transcription", "whisper", "kde", "wayland", "notes", "llm"]

[project.urls]
Homepage = "https://github.com/bigbatmanorg/dictation4me"
Documentation = "https://github.com/bigbatmanorg/dictation4me/blob/main/docs/USER_GUIDE.md"
Changelog = "https://github.com/bigbatmanorg/dictation4me/blob/main/CHANGELOG.md"
Issues = "https://github.com/bigbatmanorg/dictation4me/issues"
[project.scripts]
dictation4me = "dictation4me.cli:main"
[project.gui-scripts]
dictation4me-gui = "dictation4me.gui:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dictation4me = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["desktop: real desktop required", "network: explicitly configured provider required"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.ruff.lint.per-file-ignores]
# dbus-next declares D-Bus type signatures as string annotations ("s", "a{sv}").
"src/dictation4me/desktop/tray.py" = ["F821", "F722"]
