name: dictation4me-python
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run python -m compileall -q src tests
      - run: uv build
      # Real microphone, portal, focus, target-field paste and native GUI
      # cannot be certified in CI headless runners. Record separately.
