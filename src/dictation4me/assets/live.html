<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dictation4me — live</title>
<link rel="stylesheet" href="live.css">
</head>
<body data-nativehtmlkit-drag>
<main id="live" class="live state-recording" aria-live="polite">
  <header class="bar">
    <i class="dot" aria-hidden="true"></i>
    <strong id="live-state">Listening</strong>
    <span id="live-hint" class="hint">Press Ctrl+Alt+D to stop</span>
  </header>
  <p id="live-text" class="text placeholder">Start speaking — your words appear here.</p>
</main>
</body>
</html>
